<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="js/gd-acceso.js?v=20261017a"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo — Giandeco Studio Design</title>
<meta name="description" content="Catálogo Giandeco: productos de Navidad, mueblería e iluminación, servicios, proyectos y espacios en un solo lugar, con buscador y filtros.">
<meta name="theme-color" content="#0A0A09">
<!-- seo -->
<link rel="canonical" href="https://giandeco.com/catalogo">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Giandeco Studio Design">
<meta property="og:locale" content="es_PE">
<meta property="og:title" content="Catálogo — Giandeco Studio Design">
<meta property="og:description" content="Catálogo Giandeco: productos de Navidad, mueblería e iluminación, servicios, proyectos y espacios en un solo lugar, con buscador y filtros.">
<meta property="og:url" content="https://giandeco.com/catalogo">
<meta property="og:image" content="https://giandeco.com/images/espacios/zara-sala-1.jpg">
<meta name="twitter:card" content="summary_large_image">
<!-- /seo -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=Jost:wght@200;300;400;500&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/giandeco.css?v=20261017a">
<link rel="stylesheet" href="css/gd-tienda.css?v=20261017a">
<link rel="stylesheet" href="css/gd-movil.css?v=20261017a">
<link rel="stylesheet" href="css/gd-tema.css?v=20261017a">
<script src="js/gd-tema.js?v=20261017a"></script>
</head>
<body data-mundo="catalogo" data-seccion="home" data-cabecera="solida">

<div id="gdHeader"></div>

<main class="cg" id="cg">
  <header class="cg-cabeza">
    <div class="gd-in">
      <p class="gd-migas"><a href="./">Inicio</a> / <span>Catálogo</span></p>
      <div class="cg-titulo">
        <h1>Catálogo</h1>
        <p>Productos, servicios, proyectos y espacios de Giandeco, en un solo lugar.</p>
      </div>
      <div class="cg-gamas" role="group" aria-label="Categorías">
        <button type="button" class="cg-gama" data-gama="navidad" aria-pressed="false"><img src="images/campana/navidad-comedor-arbol.jpg" alt="" decoding="async" fetchpriority="high"><span>Navidad</span></button>
        <button type="button" class="cg-gama" data-gama="muebleria" aria-pressed="false"><img src="images/mobiliario/centro-deluxe-1.webp" alt="" decoding="async"><span>Mueblería</span></button>
        <button type="button" class="cg-gama" data-gama="iluminacion" aria-pressed="false"><img src="images/iluminacion/amaris-banner.jpg" alt="" decoding="async"><span>Iluminación</span></button>
      </div>
    </div>
  </header>

  <div class="gd-in cg-cuerpo">
    <div class="cg-tipos" id="cgTipos" role="group" aria-label="Tipo de contenido"></div>

    <div class="cg-barra">
      <form class="cg-buscar" id="cgBuscar" role="search">
        <label class="sr-only" for="cgQ">Buscar en el catálogo</label>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5L14 14"/></svg>
        <input type="search" id="cgQ" placeholder="Buscar por nombre o referencia" autocomplete="off" enterkeyhint="search" maxlength="80">
      </form>
      <button type="button" class="cg-abrir" id="cgAbrir" aria-controls="cgFiltros" aria-expanded="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M4.5 8h7M7 12h2"/></svg>Filtros <b id="cgN" hidden></b></button>
      <label class="cg-orden"><span class="sr-only">Ordenar</span><select id="cgOrden"></select></label>
      <p class="cg-cuenta" id="cgCuenta" aria-live="polite"></p>
    </div>
    <div class="cg-chips" id="cgChips" hidden></div>

    <div class="cg-layout">
      <aside class="cg-filtros" id="cgFiltros" aria-label="Filtros">
        <div class="cg-panel-cab"><h2>Filtros</h2><button type="button" class="cg-panel-x" data-cerrar aria-label="Cerrar filtros"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
        <div class="cg-grupos" id="cgGrupos"></div>
        <div class="cg-panel-pie">
          <button type="button" class="gd-btn gd-btn-ghost" id="cgLimpiarPanel" data-limpiar>Limpiar</button>
          <button type="button" class="gd-btn gd-btn-primary" id="cgVer" data-cerrar>Ver resultados</button>
        </div>
      </aside>
      <div class="cg-res">
        <div class="cg-grid" id="cgGrid" aria-busy="true">
          <div class="cg-esq"></div><div class="cg-esq"></div><div class="cg-esq"></div><div class="cg-esq"></div>
          <div class="cg-esq"></div><div class="cg-esq"></div><div class="cg-esq"></div><div class="cg-esq"></div>
        </div>
        <div class="cg-estado" id="cgEstado" hidden></div>
        <p class="cg-pronto">En preparación: <a href="proximamente-decoracion">Decoración</a> · <a href="proximamente-papel-mural">Papel mural</a></p>
      </div>
    </div>
  </div>
  <div class="cg-velo" id="cgVelo" hidden></div>
</main>

<div id="gdFooter"></div>
<script src="js/giandeco.js?v=20261017a"></script>
<script src="js/gd-proyectos.js?v=20261017a"></script>
<script src="js/gd-servicios.js?v=20261017a"></script>
<script src="js/gd-tienda.js?v=20261017a" defer></script>
<script src="js/gd-catalogo.js?v=20261017a" defer></script>
<script src="js/gd-catalogo-ui.js?v=20261017a" defer></script>
<script src="js/gd-movil.js?v=20261017a" defer></script>
<script src="js/gd-chat.js?v=20261017a" defer></script>
</body>
</html>
