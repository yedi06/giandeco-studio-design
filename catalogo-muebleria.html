<style>

  .mb-filtro{
    appearance:none; background:none; cursor:pointer; border:1px solid rgba(10,9,6,.16); border-radius:2px;
    padding:9px 16px; font-family:var(--body); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase;

  .mb-filtro.is-active{ background:var(--ebano); border-color:var(--ebano); color:var(--humo); }
